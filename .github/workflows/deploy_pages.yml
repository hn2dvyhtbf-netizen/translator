name: Deploy web app (GitHub Pages / PWA)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - name: Collect web files
      run: |
        mkdir -p www
        cp index.html app.js style.css manifest.json sw.js www/
        cp -r icons www/icons
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: www
    - id: deployment
      uses: actions/deploy-pages@v4
